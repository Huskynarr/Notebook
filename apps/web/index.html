<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Notebook · Quellenbasiertes Arbeiten</title>
    <!-- Inline, damit keine zusaetzliche Anfrage noetig ist und die Anwendung
         ohne fremde Ressourcen laeuft. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23faf8f4'/%3E%3Crect x='7' y='6' width='18' height='20' rx='2' fill='none' stroke='%2325405e' stroke-width='2'/%3E%3Cpath d='M11 12h10M11 16h10M11 20h6' stroke='%2325405e' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='19' y='18' width='6' height='4' rx='1' fill='%237a4a12'/%3E%3C/svg%3E"
    />
    <!-- Hausschrift des Designs uni-freiburg, falls lizenziert vorhanden;
         sonst wirkungslos. Siehe public/fonts/README.md. -->
    <link rel="stylesheet" href="/fonts/social.css" />
    <script>
      /* Setzt Design und Erscheinungsbild vor dem ersten Zeichnen - sonst
         blitzt beim Laden kurz das Vorgabedesign auf. Laeuft vor dem Bundle
         und kann dessen Konstanten daher nicht importieren; dass Schluessel
         und Werte hier mit src/lib/appearance.ts uebereinstimmen, prueft
         src/__tests__/appearance.test.ts. */
      (function () {
        var wurzel = document.documentElement;
        try {
          var designs = ['eigen', 'uni-freiburg', 'huskynarr'];
          var modi = ['light', 'dark'];
          /* Einstellungen liegen je nach Einwilligung (src/lib/consent.ts)
             im localStorage oder nur im sessionStorage. */
          var lesen = function (schluessel) {
            return localStorage.getItem(schluessel) || sessionStorage.getItem(schluessel);
          };
          var design = lesen('notebook.design');
          var modus = lesen('notebook.mode');
          wurzel.dataset.design = designs.indexOf(design) >= 0 ? design : 'eigen';
          if (modi.indexOf(modus) >= 0) wurzel.dataset.theme = modus;
          var sprache = lesen('notebook.lang');
          if (sprache === 'de' || sprache === 'en') wurzel.lang = sprache;
        } catch (e) {
          wurzel.dataset.design = 'eigen';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
