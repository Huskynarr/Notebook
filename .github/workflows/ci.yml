name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  fail2ban:
    name: Fail2ban-Filter und Log-Injection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fail2ban
      - run: bash tools/test-fail2ban.sh

  pruefen:
    name: Typen, Stil, Tests, Build und Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Identische lokale Qualitätsprüfung
        run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - name: Hauptablauf im Browser (klar markierter Offline-Modus)
        run: pnpm test:e2e
      - name: Sites Worker und D1/R2 Build
        run: pnpm sites:build && node tools/check-sites-output.mjs
      - name: Bundle-Größe
        run: node tools/bundle-size.mjs apps/web/dist >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
