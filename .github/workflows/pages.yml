name: Pages (optionale Offline-Demo)

# Bewusst manuell: Das Produkt mit API wird auf Plesk betrieben.
# Pages ist ausschließlich eine sichtbar markierte Browser-Demonstration.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    uses: ./.github/workflows/ci.yml

  bauen:
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Explizite Offline-Demo bauen
        env:
          VITE_DEMO: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @notebook/web build
      - name: Auch das tatsächlich ausgelieferte Demo-Bundle prüfen
        run: pnpm test:unit
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
