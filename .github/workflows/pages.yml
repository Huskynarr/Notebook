name: Pages

# Veroeffentlicht das Frontend als Demo ohne Server.
#
# Die Demo laeuft vollstaendig im Browser: Anmeldung, Notebooks, Quellen,
# Notizen und Belegmechanik sind echt und liegen im localStorage. Es gibt kein
# Sprachmodell - Antworten zeigen die gefundenen Belegstellen und sind so
# gekennzeichnet, genau wie beim Server mit LLM_PROVIDER=stub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein laufender Veroeffentlichungsvorgang wird nicht abgebrochen, damit keine
# halb hochgeladene Ausgabe stehen bleibt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Die erzeugte theme.css muss zum Generator passen; weicht sie ab, ist
      # jemand von Hand hineingeraten.
      - name: Design-Tokens pruefen
        run: |
          pnpm theme
          git diff --exit-code apps/web/src/styles/theme.css

      - name: Frontend als Demo bauen
        env:
          VITE_DEMO: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @notebook/web build

      # 404.html = index.html: so landet ein direkt aufgerufener Unterpfad
      # nicht auf der Fehlerseite von GitHub.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
