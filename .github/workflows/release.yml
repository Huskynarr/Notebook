name: Release

# Releases entstehen aus den Commit-Praefixen (Conventional Commits):
# release-please haelt einen Release-PR mit CHANGELOG und Versionssprung
# offen; sein Merge erzeugt Tag und GitHub-Release. Versionsnummern setzt
# niemand von Hand.
#
# Voraussetzung in den Repository-Einstellungen: Actions > General >
# "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
