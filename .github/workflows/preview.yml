name: Vorschau-Artefakt (manuell)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    uses: ./.github/workflows/ci.yml

  demo:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sichtbar markierte Browser-Demo bauen
        env:
          VITE_DEMO: 'true'
        run: pnpm --filter @notebook/web build
      - run: pnpm test:unit
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-offline-demo-${{ github.sha }}
          path: apps/web/dist
          retention-days: 14
          if-no-files-found: error
