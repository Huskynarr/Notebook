# Woechentliche Aktualisierungen, gebuendelt: ein PR fuer alle kleinen
# npm-Updates, einer fuer Actions. Grosse Versionsspruenge kommen einzeln.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-und-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
