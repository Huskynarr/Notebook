# Matches only the application's structured, single-line authentication events.
# Keep field order aligned with the actual Fastify/Pino logger; do not match a
# free-form URL, username, header or message containing an apparent event.
[Definition]
_prefix = \{"level":40,"time":"[^"]*","pid":\d+,"hostname":"(?:[^"\\]|\\.)*","reqId":"(?:[^"\\]|\\.)*",
failregex = ^%(_prefix)s"event":"auth_failed","ip":"<ADDR>","msg":"Login fehlgeschlagen"\}$
            ^%(_prefix)s"event":"auth_rate_limited","ip":"<ADDR>","msg":"Login gedrosselt"\}$
ignoreregex =
# %z parses the logger's Z as UTC, independently of the host's local timezone.
datepattern = (?<="time":")%%Y-%%m-%%dT%%H:%%M:%%S\.%%f%%z(?=")
maxlines = 1
# Match the user service from deploy/notebook.service, not a system unit.
journalmatch = _SYSTEMD_USER_UNIT=notebook.service SYSLOG_IDENTIFIER=notebook-api
