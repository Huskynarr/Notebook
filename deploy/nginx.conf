# Plesk vHost snippet; validate with nginx -t before reload.
# Document root is notebook/current/apps/web/dist, NOT the repository root.
client_max_body_size 21m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
# Inline styles support resizable columns; executable inline scripts stay blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

location /v1/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # $remote_addr must first be restored through TRUSTED Cloudflare ranges.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# Do not add a second location / if Plesk already defines one.
